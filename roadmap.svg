<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Five phases, each closed by a pass-or-fail gate" xmlns:c2pa="http://c2pa.org/manifest"><rect width="760" height="380" fill="#ffffff"/>
  <g font-family="DejaVu Sans Mono, monospace">
    <text x="24" y="30" font-size="15" font-weight="600" fill="#1a2030" font-family="DejaVu Sans, sans-serif">Five phases, each closed by a pass-or-fail gate</text>

    <g>
      <rect x="24" y="56" width="300" height="50" rx="6" fill="#f1f3f7" stroke="#9aa6bd"/>
      <text x="40" y="77" font-size="13" font-weight="600" fill="#1a2030">Phase 0 · Paper</text>
      <text x="40" y="95" font-size="11.5" fill="#5a6478">Months 0–6 · under $1M</text>
      <line x1="324" y1="81" x2="356" y2="81" stroke="#9aa6bd"/>
      <path d="M366 72 l9 9 l-9 9 l-9 -9z" fill="#1b8fc0"/>
      <text x="388" y="77" font-size="11.5" fill="#5a6478">Gate 0: figures sourced, design reviewed by three</text>
      <text x="388" y="93" font-size="11.5" fill="#5a6478">specialists, partners signed</text>
    </g>
    <g>
      <rect x="24" y="114" width="300" height="50" rx="6" fill="#f1f3f7" stroke="#9aa6bd"/>
      <text x="40" y="135" font-size="13" font-weight="600" fill="#1a2030">Phase 1 · Bench</text>
      <text x="40" y="153" font-size="11.5" fill="#5a6478">Years 1–3 · $30–60M</text>
      <line x1="324" y1="139" x2="356" y2="139" stroke="#9aa6bd"/>
      <path d="M366 130 l9 9 l-9 9 l-9 -9z" fill="#1b8fc0"/>
      <text x="388" y="135" font-size="11.5" fill="#5a6478">Gate 1: a tile with a 1 Mbit ROM runs a small</text>
      <text x="388" y="151" font-size="11.5" fill="#5a6478">network at 8–10 K</text>
    </g>
    <g>
      <rect x="24" y="172" width="300" height="50" rx="6" fill="#f1f3f7" stroke="#9aa6bd"/>
      <text x="40" y="193" font-size="13" font-weight="600" fill="#1a2030">Phase 2 · Rehearsal on Earth</text>
      <text x="40" y="211" font-size="11.5" fill="#5a6478">Years 2–5 · $100–200M</text>
      <line x1="324" y1="197" x2="356" y2="197" stroke="#9aa6bd"/>
      <path d="M366 188 l9 9 l-9 9 l-9 -9z" fill="#1b8fc0"/>
      <text x="388" y="193" font-size="11.5" fill="#5a6478">Gate 2: one square metre of tile, made in the chamber</text>
      <text x="388" y="209" font-size="11.5" fill="#5a6478">from simulant, runs a GPT-2-class model</text>
    </g>
    <g>
      <rect x="24" y="230" width="300" height="50" rx="6" fill="#f1f3f7" stroke="#9aa6bd"/>
      <text x="40" y="251" font-size="13" font-weight="600" fill="#1a2030">Phase 3 · Lunar precursors</text>
      <text x="40" y="269" font-size="11.5" fill="#5a6478">Years 4–8 · $0.5–1.5B</text>
      <line x1="324" y1="255" x2="356" y2="255" stroke="#9aa6bd"/>
      <path d="M366 246 l9 9 l-9 9 l-9 -9z" fill="#1b8fc0"/>
      <text x="388" y="251" font-size="11.5" fill="#5a6478">Gate 3: an Earth-made oracle answers from a cold trap</text>
      <text x="388" y="267" font-size="11.5" fill="#5a6478">for a year; first junction made on the Moon</text>
    </g>
    <g>
      <rect x="24" y="288" width="300" height="50" rx="6" fill="#e2f4fb" stroke="#1b8fc0" stroke-width="1.6"/>
      <text x="40" y="309" font-size="13" font-weight="600" fill="#1a2030">Phase 4 · Polar foundry</text>
      <text x="40" y="327" font-size="11.5" fill="#5a6478">Years 8–15 · $5–15B</text>
      <line x1="324" y1="313" x2="356" y2="313" stroke="#9aa6bd"/>
      <path d="M366 304 l9 9 l-9 9 l-9 -9z" fill="#1b8fc0"/>
      <text x="388" y="309" font-size="11.5" fill="#5a6478">Gate 4: an oracle built on the Moon, then a year under</text>
      <text x="388" y="325" font-size="11.5" fill="#5a6478">100 kg of imports with the Earth link cut</text>
    </g>
    <text x="24" y="364" font-size="11.5" fill="#5a6478">About $6–17B over 15 years. The first three phases, all on Earth, total $130–260M.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
